apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp168-api
  labels:
    app: mp168-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp168-api
  template:
    metadata:
      labels:
        app: mp168-api
    spec:
      containers:
        - name: mp168-api
          image: mp168-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mp168-svc
  labels:
    app: mp168-api
spec:
  type: ClusterIP
  selector:
    app: mp168-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
